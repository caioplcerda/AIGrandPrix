# AI Grand Prix - Default Configuration

race:
  max_speed: 15.0          # m/s maximum drone speed
  max_accel: 10.0          # m/s^2 maximum acceleration
  control_dt: 0.01         # control loop timestep (100 Hz)
  replan_interval: 0.3     # seconds between trajectory replanning
  gate_closing_range: 4.0       # meters — activation distance for gate closing mode
  gate_closing_speed_frac: 0.5  # fraction of max_speed for gate approach
  gate_closing_speed_cap: 7.0   # m/s hard cap on gate approach speed
  gate_closing_dist_scale: 2.0  # speed = dist_to_gate * this factor
  gate_closing_vz_clamp: -2.0   # max downward velocity in gate closing
  trajectory_lookahead: 30      # points to search ahead for closest waypoint
  trajectory_speed_frac: 0.7    # fraction of max_speed for trajectory planning

perception:
  method: "hybrid"         # color | cnn | hybrid
  camera_fov: 90           # degrees
  image_width: 640
  image_height: 480
  gate_color_lower: [0, 100, 100]    # HSV lower bound
  gate_color_upper: [10, 255, 255]   # HSV upper bound
  gate_real_width: 1.0
  gate_real_height: 1.0
  camera:
    fx: 320.0
    fy: 320.0
    cx: 320.0
    cy: 240.0
  cnn:
    backend: "custom"
    model_path: null
    confidence_threshold: 0.5
    nms_threshold: 0.4
    input_size: [320, 320]
  tracking:
    enabled: false
    max_age: 0.5
    min_hits: 3
    match_threshold: 2.0
    process_noise: 0.01
    measurement_noise: 0.5
  state_estimator:
    enabled: false
    process_noise_pos: 0.1
    process_noise_vel: 1.0
    process_noise_orient: 0.01
    process_noise_gyro: 0.1
    process_noise_accel_bias: 0.001
    measurement_noise_pos: 0.5

control:
  controller_type: "pid"         # "pid" | "mpc"
  physics_mode: "simplified"     # "simplified" | "full"
  max_accel: 15.0
  pid:
    kp: [6.0, 6.0, 8.0]
    ki: [0.1, 0.1, 0.2]
    kd: [3.5, 3.5, 4.5]
    gain_scheduling:
      enabled: true
      kp_high_speed_scale: 0.6
      kd_high_speed_scale: 1.6
      ki_high_speed_scale: 0.2
  attitude:
    kp: 8.0
    kd: 2.0
    kp_yaw: 3.0
    kd_yaw: 1.0
  # Full dynamics preset (use when physics_mode: "full"):
  #   pid:
  #     kp: [3.0, 3.0, 5.0]
  #     kd: [4.0, 4.0, 5.0]
  #     ki: [0.05, 0.05, 0.1]
  mpc:
    horizon: 10
    dt: 0.02
    Q_pos: [10.0, 10.0, 20.0]
    Q_vel: [2.0, 2.0, 5.0]
    R: [0.1, 0.01, 0.01]
    Q_terminal_scale: 2.0
    max_solve_time_ms: 5.0
  max_rate: 8.0            # rad/s max angular rate
  max_thrust: 1.0          # normalized

planning:
  approach_distance: 1.0   # meters before gate for approach waypoint
  exit_distance: 0.5       # meters after gate for exit waypoint
  trajectory_dt: 0.02      # trajectory sampling interval
  trajectory_method: "min_snap"  # cubic_spline | min_jerk | min_snap
  racing_line:
    enabled: true
    gate_margin: 0.15        # meters from gate edge
    curvature_weight: 2.0    # penalty for curvature at waypoints
  time_allocation:
    enabled: true
    min_segment_time: 0.1    # seconds
    max_iterations: 50
    tolerance: 0.01
  min_snap:
    regularization: 1.0e-6

drone:
  mass: 0.75
  arm_length: 0.125
  Ixx: 0.0025
  Iyy: 0.0025
  Izz: 0.0045
  thrust_coeff: 1.0e-5
  drag_coeff: 1.0e-7
  motor_max_rpm: 25000
  linear_drag: 0.01
  gravity: 9.81
  motor_time_constant: 0.02

normalization:
  pos_bound: 50.0
  vel_bound: 30.0
  angular_vel_bound: 10.0
  gate_rel_bound: 50.0

simulation:
  num_gates: 5
  max_steps: 2000
  render: false
  use_dynamics_model: false
  normalize_obs: false
  normalize_actions: false

training:
  algorithm: "PPO"
  total_timesteps: 1000000
  learning_rate: 0.0003
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
